<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Go Web Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #f9fafb;
      color: #333;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #43cfc4;
      color: #fff;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.2rem;
    }

    #usernameDisplay {
      font-size: 1rem;
      opacity: 0.9;
      cursor: pointer;
    }

    #chatWrapper {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #userList {
      width: 20%;
      background: #f1f5f9;
      border-right: 1px solid #ddd;
      padding: 1rem;
      overflow-y: auto;
    }

    #userList h3 {
      margin-top: 0;
      font-size: 1.1rem;
      border-bottom: 1px solid #ccc;
      padding-bottom: 0.5rem;
    }

    #userList ul {
      list-style: none;
      padding: 0;
    }

    #userList li {
      padding: 0.3rem 0;
    }

    #chat {
      flex: 1;
      padding: 1rem 1.5rem;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .message {
      margin: 0.5rem 0;
      padding: 0.6rem 1rem;
      border-radius: 6px;
      background: #e8f0fe;
      max-width: 75%;
      line-height: 1.4;
    }

    .message.you {
      background: #d1ffd1;
      align-self: flex-end;
      text-align: right;
      margin-left: auto;
    }

    #inputArea {
      display: flex;
      padding: 1rem 1.5rem;
      gap: 0.5rem;
      border-top: 1px solid #ddd;
      background: #fff;
    }

    #msg {
      flex: 1;
      padding: 0.6rem 0.8rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      padding: 0.6rem 1rem;
      font-size: 1rem;
      background-color: #3f51b5;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #303f9f;
    }

    @media (max-width: 600px) {
      header, #chat, #inputArea {
        padding: 1rem;
      }

      #chatWrapper {
        flex-direction: column;
      }

      #userList {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #ddd;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>VibeChat</div>
    <div id="usernameDisplay" title="Click to change name"></div>
  </header>

  <div id="chatWrapper">
    <div id="userList">
      <h3>Online Users</h3>
      <ul id="usersUl"></ul>
    </div>

    <div id="chat"></div>
  </div>

  <div id="inputArea">
    <input id="msg" type="text" placeholder="Type your message..." autocomplete="off" />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    let username = prompt("Enter your username") || "Anonymous";
    document.getElementById("usernameDisplay").innerText = `👤 ${username}`;

    const chat = document.getElementById("chat");
    const msgInput = document.getElementById("msg");
    const usernameDisplay = document.getElementById("usernameDisplay");
    const usersUl = document.getElementById("usersUl");

    const socket = new WebSocket("ws://" + location.host + "/ws");

    socket.addEventListener("open", () => {
      socket.send(JSON.stringify({ type: "join", username }));
    });

    socket.addEventListener("message", function (event) {
      const data = JSON.parse(event.data);

      if (data.type === "chat") {
        const msg = `[${data.username}]: ${data.text}`;
        const div = document.createElement("div");
        div.className = "message";
        if (data.username === username) div.classList.add("you");
        div.textContent = msg;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }

      if (data.type === "error") {
        alert(data.message);
      }

      if (data.type === "rename_success") {
        username = data.newName;
        usernameDisplay.innerText = `👤 ${username}`;
      }

      if (data.type === "user_list") {
        usersUl.innerHTML = "";
        data.users.forEach((user) => {
          const li = document.createElement("li");
          li.textContent = user;
          usersUl.appendChild(li);
        });
      }
    });

    function sendMessage() {
      const text = msgInput.value.trim();
      if (text === "") return;
      socket.send(JSON.stringify({ type: "chat", username, text }));
      msgInput.value = "";
    }

    msgInput.addEventListener("keypress", function (e) {
      if (e.key === "Enter") sendMessage();
    });

    usernameDisplay.addEventListener("click", () => {
      const newName = prompt("Enter new username:");
      if (!newName || newName === username) return;
      socket.send(JSON.stringify({ type: "rename", oldName: username, newName }));
    });
  </script>
</body>
</html>
